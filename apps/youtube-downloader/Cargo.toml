[package]
name = "youtube-downloader"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A GPUI desktop interface for yt-dlp"

[dependencies]
anyhow = "1"
async-channel = "2"
gpui-kit = "=0.6.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tempfile = "3"
